# Overrides the build settings in the Netlify UI
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Astro build output: file names carry a content hash, so a file at a given URL never changes
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old domain, kept as a domain alias: send every path to the new primary domain
[[redirects]]
  from = "https://scala.monster/*"
  to = "https://pavels.im/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.scala.monster/*"
  to = "https://pavels.im/:splat"
  status = 301
  force = true
